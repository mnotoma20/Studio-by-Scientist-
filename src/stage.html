<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Studio - Stage Display</title>
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Arial Black', Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Top bar ──────────────────────────── */
    #topBar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6vh 3vw;
      background: rgba(255,255,255,0.035);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }

    #clock {
      font-size: min(5vw, 11vh);
      line-height: 1;
      white-space: nowrap;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      color: rgba(255,255,255,0.92);
      letter-spacing: 3px;
    }

    #elapsedWrap {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    #elapsedLabel {
      font-size: 18px;
      font-family: monospace;
      color: rgba(255,255,255,0.45);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #elapsedTimer {
      font-size: min(6.5vw, 14vh);
      white-space: nowrap;
      line-height: 1;
      font-weight: 800;
      font-family: 'Courier New', monospace;
      color: #fff;
      letter-spacing: 3px;
      min-width: 5ch;
      text-align: right;
    }

    /* ── Main content ─────────────────────── */
    #mainContent {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .mode {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 80px;
      text-align: center;
    }

    .mode.active {
      display: flex;
      animation: fadeUp 0.35s ease-out forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* ── Welcome / idle ───────────────────── */
    #welcomeTitle {
      font-size: 52px;
      color: rgba(255,255,255,0.07);
      letter-spacing: 8px;
      text-transform: uppercase;
      font-weight: 900;
    }

    #welcomeSub {
      font-size: 18px;
      color: rgba(255,255,255,0.12);
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-top: 14px;
      font-weight: 300;
    }

    /* ── Scripture / Bible verse ──────────── */
    #verseRef {
      font-size: clamp(30px, 3.2vw, 62px);
      font-weight: 900;
      color: #FFD700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
      flex-shrink: 0;
      text-shadow: 0 0 30px rgba(255,215,0,0.35);
      line-height: 1.1;
    }

    #verseText {
      font-size: 96px;
      font-weight: 900;
      line-height: 1.2;
      color: #fff;
    }

    #verseTrans {
      font-size: 32px;
      color: rgba(255,255,255,0.38);
      margin-top: 22px;
      font-weight: 300;
      font-family: Arial, sans-serif;
    }

    /* ── Lyrics / song ────────────────────── */
    #songTitle {
      font-size: 28px;
      color: rgba(255,255,255,0.30);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 36px;
      font-weight: 400;
      font-family: Arial, sans-serif;
    }

    #lyricsMain {
      font-size: 96px;
      font-weight: 900;
      line-height: 1.25;
      color: #fff;
      white-space: pre-line;
    }

    #lyricsNext {
      font-size: 58px;
      font-weight: 700;
      line-height: 1.3;
      color: rgba(255,255,255,0.18);
      margin-top: 18px;
      white-space: pre-line;
      font-family: Arial, sans-serif;
    }

    /* ── Prayer ───────────────────────────── */
    #prayerTitle {
      font-size: 36px;
      color: rgba(255,215,0,0.65);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 32px;
      font-weight: 700;
    }

    #prayerText {
      font-size: 88px;
      font-weight: 900;
      line-height: 1.25;
      color: #fff;
    }

    /* ── Info mode (background/PPTX) ─────── */
    #infoIcon {
      font-size: 72px;
      margin-bottom: 24px;
      opacity: 0.2;
    }

    #infoLabel {
      font-size: 42px;
      color: rgba(255,255,255,0.22);
      letter-spacing: 6px;
      text-transform: uppercase;
      font-weight: 900;
    }

    #infoSub {
      font-size: 26px;
      color: rgba(255,255,255,0.12);
      margin-top: 14px;
      font-weight: 300;
      font-family: Arial, sans-serif;
      max-width: 80%;
    }
    #infoSub.content {
      font-size: 64px;
      color: #fff;
      font-weight: 600;
      line-height: 1.25;
      max-width: 92%;
      white-space: pre-line;
      overflow: hidden;
    }
    #infoLabel.small { font-size: 20px; letter-spacing: 5px; color: rgba(255,255,255,0.35); }
    #infoImg { display:none; max-width:70%; max-height:38%; object-fit:contain; margin-top:18px; border:1px solid rgba(255,255,255,0.15); }

    /* ── Bottom next-item strip ───────────── */
    #nextItemBar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 13px 44px;
      background: rgba(255,255,255,0.025);
      border-top: 1px solid rgba(255,255,255,0.055);
      flex-shrink: 0;
    }

    #nextLabel {
      font-size: 10px;
      font-family: monospace;
      color: rgba(255,255,255,0.22);
      letter-spacing: 5px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    #nextArrow {
      font-size: 16px;
      color: rgba(255,255,255,0.15);
      flex-shrink: 0;
    }

    #nextItemTitle {
      font-size: 22px;
      color: rgba(255,255,255,0.28);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <!-- ── Top bar ─────────────────────────── -->
  <div id="topBar">
    <div id="clock">00:00:00 AM</div>
    <div id="elapsedWrap">
      <span id="elapsedLabel">ELAPSED</span>
      <div id="elapsedTimer">—:——</div>
    </div>
  </div>

  <!-- ── Main content area ──────────────── -->
  <div id="mainContent">

    <!-- Idle -->
    <div id="welcomeMode" class="mode active">
      <div id="welcomeTitle">Studio by Scientist</div>
      <div id="welcomeSub">Stage Display · Confidence Monitor</div>
    </div>

    <!-- Bible verse -->
    <div id="verseMode" class="mode">
      <div id="verseRef"></div>
      <div id="verseText"></div>
      <div id="verseTrans"></div>
    </div>

    <!-- Song lyrics -->
    <div id="lyricsMode" class="mode">
      <div id="songTitle"></div>
      <div id="lyricsMain"></div>
      <div id="lyricsNext"></div>
    </div>

    <!-- Prayer -->
    <div id="prayerMode" class="mode">
      <div id="prayerTitle"></div>
      <div id="prayerText"></div>
    </div>

    <!-- Background / PPTX info -->
    <div id="slideMode" class="mode" style="padding:16px;">
      <div id="slideBox" style="position:relative;overflow:hidden;aspect-ratio:16/9;max-width:100%;max-height:100%;height:100%;box-shadow:0 0 0 1px rgba(255,255,255,0.15);"></div>
    </div>

    <div id="infoMode" class="mode">
      <div id="infoIcon"></div>
      <div id="infoLabel"></div>
      <div id="infoSub"></div>
      <img id="infoImg" />
    </div>

  </div>

  <!-- ── Bottom strip ────────────────────── -->
  <div id="nextItemBar">
    <span id="nextLabel">UP NEXT</span>
    <span id="nextArrow">›</span>
    <span id="nextItemTitle">—</span>
  </div>

  <script>
  const { ipcRenderer } = require('electron');

  // ── Clock (updates every second, computed locally) ──────────────
  function updateClock() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', {
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
    });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── Per-item elapsed timer ───────────────────────────────────────
  // Driven by a startedAt timestamp broadcast from main.js when any
  // content goes live. Computed locally — no IPC per second.
  let itemStartedAt = null;

  function fmtElapsed(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  setInterval(() => {
    const el = document.getElementById('elapsedTimer');
    el.textContent = itemStartedAt === null ? '—:——' : fmtElapsed(Date.now() - itemStartedAt);
  }, 1000);

  ipcRenderer.on('item-went-live', (_e, { startedAt }) => {
    itemStartedAt = startedAt;
  });

  // ── Mode switching ───────────────────────────────────────────────
  const MODES = ['welcomeMode', 'verseMode', 'lyricsMode', 'prayerMode', 'infoMode', 'slideMode'];

  function showMode(id) {
    MODES.forEach(m => {
      const el = document.getElementById(m);
      el.classList.remove('active');
      el.style.display = 'none';
    });
    const target = document.getElementById(id);
    if (!target) return;
    target.style.display = 'flex';
    // Force reflow so the CSS animation retriggers each time
    void target.offsetWidth;
    target.classList.add('active');
  }

  // ── Auto-fit: shrink font until content fits the container ───────
  function autoFitEl(el, maxPx, minPx) {
    const parent = el.closest('.mode');
    if (!parent) return;
    let size = maxPx;
    el.style.fontSize = size + 'px';
    const cs = getComputedStyle(parent);
    const avail = parent.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    // Total height of everything in the mode (title, text, translation), so nothing spills off the top
    const total = () => [...parent.children].reduce((a, c) => {
      const k = getComputedStyle(c);
      return a + c.offsetHeight + parseFloat(k.marginTop || 0) + parseFloat(k.marginBottom || 0);
    }, 0);
    while (size > minPx && total() > avail) {
      size -= 2;
      el.style.fontSize = size + 'px';
    }
  }

  // ── Lyric section parser for "next line" preview ─────────────────
  // Splits full lyrics into sections divided by [Header] markers.
  // Returns array of string arrays (one per section).
  function parseLyricSections(text) {
    const sections = [];
    let cur = [];
    for (const raw of text.split('\n')) {
      const line = raw.trim();
      if (!line) continue;
      if (/^\[.+\]$/.test(line)) {
        if (cur.length) { sections.push(cur); cur = []; }
      } else {
        cur.push(line);
      }
    }
    if (cur.length) sections.push(cur);
    return sections;
  }

  // ── IPC: Bible verse ─────────────────────────────────────────────
  ipcRenderer.on('show-verse', (_e, verse) => {
    document.getElementById('verseRef').textContent = verse.reference || '';

    const clean = (verse.text || '').replace(/[\n\r\t]+/g, ' ').replace(/\s+/g, ' ').trim();
    const wc = clean.split(/\s+/).length;
    // Scale: fewer words = bigger text, readable from 30+ feet
    const basePx = wc <= 6 ? 124 : wc <= 12 ? 100 : wc <= 22 ? 84 : wc <= 36 ? 68 : 54;
    document.getElementById('verseText').textContent = clean;
    document.getElementById('verseText').style.fontSize = basePx + 'px';
    document.getElementById('verseTrans').textContent = verse.translation ? `(${verse.translation})` : '';

    showMode('verseMode');
    // Let DOM settle then check overflow
    requestAnimationFrame(() => autoFitEl(document.getElementById('verseText'), basePx, 14));
  });

  // ── IPC: Song lyrics ─────────────────────────────────────────────
  ipcRenderer.on('show-lyrics', (_e, data) => {
    const titleStr = data.author
      ? `${data.title}  ·  ${data.author}`
      : (data.title || '');
    document.getElementById('songTitle').textContent = titleStr;

    const sections = parseLyricSections(data.lyrics || '');
    const mainEl = document.getElementById('lyricsMain');
    const nextEl = document.getElementById('lyricsNext');

    if (sections.length === 0) {
      mainEl.textContent = data.lyrics || '';
      nextEl.textContent = '';
    } else {
      // Current section → main; first line of next section → dimmed preview
      mainEl.textContent = sections[0].join('\n');
      nextEl.textContent = sections.length > 1 ? sections[1][0] : '';
    }

    showMode('lyricsMode');
    requestAnimationFrame(() => autoFitEl(mainEl, 96, 14));
  });

  // ── IPC: Prayer ───────────────────────────────────────────────────
  ipcRenderer.on('show-prayer-combined', (_e, data) => {
    document.getElementById('prayerTitle').textContent = data.title || 'Prayer';

    const text = (data.text || '').replace(/[\n\r\t]+/g, ' ').replace(/\s+/g, ' ').trim();
    const wc = text.split(/\s+/).length;
    const basePx = wc <= 8 ? 108 : wc <= 18 ? 88 : wc <= 32 ? 70 : 56;
    const prayerTextEl = document.getElementById('prayerText');
    prayerTextEl.textContent = text;
    prayerTextEl.style.fontSize = basePx + 'px';

    showMode('prayerMode');
    requestAnimationFrame(() => autoFitEl(prayerTextEl, basePx, 14));
  });

  // ── IPC: Background image (show info label, no media) ────────────
  ipcRenderer.on('show-background', () => {
    document.getElementById('infoIcon').textContent = '🖼';
    document.getElementById('infoLabel').textContent = 'Background Image';
    document.getElementById('infoSub').textContent = '';
    document.getElementById('infoSub').classList.remove('content');
    document.getElementById('infoImg').style.display = 'none';
    showMode('infoMode');
  });

  // ── IPC: PPTX slide / deck page — mirror exactly what the main display shows ──
  function slideBox() {
    showMode('slideMode');
    const box = document.getElementById('slideBox');
    box.style.width = Math.min(box.parentElement.clientWidth - 32, (box.parentElement.clientHeight - 32) * 16 / 9) + 'px';
    box.style.height = (box.clientWidth * 9 / 16) + 'px';
    return box;
  }

  ipcRenderer.on('show-pptx-slide', (_e, slide) => {
    const box = slideBox();
    const H = box.clientHeight;
    if (slide.image) {
      box.style.background = '#000';
      box.innerHTML = `<img src="${slide.image}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;" />`;
      return;
    }
    box.style.background = slide.bgImage ? `url('${slide.bgImage}') center/cover no-repeat` : (slide.background || '#1a1a2e');
    let html = '';
    for (const img of (slide.images || [])) {
      html += `<img src="${img.src}" style="position:absolute;left:${img.x}%;top:${img.y}%;width:${img.w}%;height:${img.h}%;object-fit:contain;" />`;
    }
    for (const shape of (slide.shapes || [])) {
      html += `<div style="position:absolute;left:${shape.x}%;top:${shape.y}%;width:${shape.w}%;height:${shape.h}%;overflow:hidden;display:flex;flex-direction:column;justify-content:center;">`;
      for (const para of (shape.paragraphs || [])) {
        html += `<p style="margin:0;padding:0 4px;text-align:${para.align};line-height:1.2;">`;
        for (const run of (para.runs || [])) {
          html += `<span style="font-size:${(run.size * H / 540).toFixed(1)}px;color:${run.color};font-weight:${run.bold ? '800' : '400'};font-family:Arial,Helvetica,sans-serif;">${run.text}</span>`;
        }
        html += '</p>';
      }
      html += '</div>';
    }
    box.innerHTML = html;
  });

  function deckEl(el, H) {
    const fs = (el.fontSize || 32) * (H / 1080);
    if (el.type === 'text') {
      const j = el.align === 'left' ? 'flex-start' : el.align === 'right' ? 'flex-end' : 'center';
      return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:${j};text-align:${el.align || 'center'};font-family:${el.fontFamily || 'Arial,sans-serif'};font-size:${fs}px;color:${el.color || '#fff'};font-weight:${el.bold ? '800' : '400'};font-style:${el.italic ? 'italic' : 'normal'};text-decoration:${el.underline ? 'underline' : 'none'};overflow:hidden;line-height:1.2;">${el.html || ''}</div>`;
    }
    if (el.type === 'scripture') {
      return `<div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:${el.align || 'center'};font-family:${el.fontFamily || 'Georgia,serif'};overflow:hidden;"><div style="font-size:${fs}px;color:${el.color || '#fff'};line-height:1.3;">${el.text || ''}</div><div style="font-size:${fs * 0.4}px;color:${el.refColor || '#FFD700'};font-weight:700;margin-top:8px;">${el.reference || ''}</div></div>`;
    }
    if (el.type === 'image') return `<img src="${el.src}" style="width:100%;height:100%;object-fit:${el.objectFit || 'contain'};">`;
    if (el.type === 'shape') {
      if (el.shapeType === 'line') return `<svg width="100%" height="100%" style="overflow:visible;display:block;"><line x1="0" y1="0" x2="100%" y2="100%" stroke="${el.strokeColor || '#fff'}" stroke-width="${el.strokeWidth || 2}" opacity="${el.strokeOpacity ?? 1}"/></svg>`;
      return `<div style="width:100%;height:100%;border-radius:${el.shapeType === 'ellipse' ? '50%' : '0'};background:${el.fillColor || 'transparent'};opacity:${el.fillOpacity ?? 1};border:${el.strokeWidth ? el.strokeWidth + 'px solid ' + (el.strokeColor || '#fff') : 'none'};box-sizing:border-box;"></div>`;
    }
    return '';
  }

  ipcRenderer.on('show-slide-deck-page', (_e, page) => {
    const box = slideBox();
    const H = box.clientHeight;
    const bg = page.background || {};
    box.style.background = (bg.type === 'image' && bg.imageUrl) ? `url('${bg.imageUrl}') center/cover no-repeat` : (bg.color || '#1a1a2e');
    let html = bg.overlayOpacity > 0 ? `<div style="position:absolute;inset:0;background:${bg.overlayColor || '#000'};opacity:${bg.overlayOpacity};"></div>` : '';
    [...(page.elements || [])].sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0)).forEach(el => {
      html += `<div style="position:absolute;left:${el.x}%;top:${el.y}%;width:${el.w}%;height:${el.h}%;transform:rotate(${el.rotation || 0}deg);z-index:${el.zIndex || 0};">${deckEl(el, H)}</div>`;
    });
    box.innerHTML = html;
  });

  // ── IPC: Clear ───────────────────────────────────────────────────
  ipcRenderer.on('clear-display', () => {
    itemStartedAt = null;
    document.getElementById('nextItemTitle').textContent = '—';
    showMode('welcomeMode');
  });

  // ── IPC: Next-item hint from schedule panel ───────────────────────
  ipcRenderer.on('set-next-item', (_e, data) => {
    document.getElementById('nextItemTitle').textContent = data.title || '—';
  });
  </script>

</body>
</html>
