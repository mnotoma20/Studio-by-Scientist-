<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../../assets/logo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      animation: fadeIn 0.4s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    img { width: 220px; height: auto; }
    .name {
      color: rgba(255,255,255,0.8);
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 10px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <img src="../../assets/logo.png" alt="Studio">
  <div class="name">STUDIO</div>
</body>
</html>
