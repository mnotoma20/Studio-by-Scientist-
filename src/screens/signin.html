<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sign In - Studio by Scientist</title>
  <link rel="icon" type="image/png" href="../../assets/logo.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Standard-gamut screens (most Windows laptops) render the same sRGB hex noticeably
       flatter than a wide-gamut panel. Nearly every Mac matches `color-gamut: p3` and
       skips this block, so Mac is unchanged; other screens get a saturation nudge plus
       ambient glow so the purple/pink still reads rich. */
    @media not all and (color-gamut: p3) {
      .logo-text,
      .btn-primary { filter: saturate(1.18) contrast(1.03); }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(52vw 52vh at 18% 12%, rgba(167, 139, 250, 0.30), transparent 62%),
          radial-gradient(46vw 46vh at 86% 88%, rgba(236, 72, 153, 0.28), transparent 62%);
      }
      .auth-container { position: relative; z-index: 1; }
    }

    .auth-container {
      background: rgba(26, 26, 46, 0.95);
      border: 2px solid rgba(167, 139, 250, 0.3);
      border-radius: 20px;
      padding: 50px;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-text {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, #a78bfa 0%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .logo-tagline {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 300;
    }

    .auth-title {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
      color: #fff;
    }

    .auth-subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(45, 45, 74, 0.8);
      border: 2px solid rgba(167, 139, 250, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      transition: all 0.3s;
      outline: none;
    }

    .form-input:focus {
      border-color: #a78bfa;
      background: rgba(45, 45, 74, 1);
      box-shadow: 0 0 20px rgba(167, 139, 250, 0.2);
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
    }

    .checkbox-label input {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #a78bfa;
    }

    .forgot-link {
      color: #a78bfa;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.3s;
    }

    .forgot-link:hover {
      color: #ec4899;
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #a78bfa 0%, #ec4899 100%);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 10px 30px rgba(236, 72, 153, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(236, 72, 153, 0.5);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .auth-switch {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
    }

    .auth-link {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.3s;
    }

    .auth-link:hover {
      color: #ec4899;
      text-decoration: underline;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .error-message.show {
      display: block;
      animation: shake 0.4s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    .success-message {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.5);
      color: #86efac;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .success-message.show {
      display: block;
      animation: slideIn 0.4s;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="logo">
      <div class="logo-text">STUDIO BY SCIENTIST</div>
      <div class="logo-tagline">AI-Powered Church Presentations</div>
    </div>

    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Sign in to continue to your church</p>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <form id="signinForm">
      <!-- Email -->
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input
          type="email"
          class="form-input"
          id="email"
          placeholder="your@email.com"
          required
          autofocus
        />
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label">Password</label>
        <input
          type="password"
          class="form-input"
          id="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <!-- Options -->
      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe" />
          <span>Remember me</span>
        </label>
        <a class="forgot-link" onclick="forgotPassword()">Forgot password?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-primary" id="submitBtn">
        Sign In
      </button>
    </form>

    <div class="auth-switch">
      Don't have an account?
      <a class="auth-link" onclick="goToSignUp()">Sign Up</a>
    </div>

    <div style="text-align: center; margin-top: 20px; font-size: 12px; color: rgba(255,255,255,0.4); line-height: 1.8;">
      By signing in you agree to our
      <a onclick="openLink('terms')" style="color: rgba(167,139,250,0.7); cursor: pointer; text-decoration: underline;">Terms of Service</a>
      and
      <a onclick="openLink('privacy')" style="color: rgba(167,139,250,0.7); cursor: pointer; text-decoration: underline;">Privacy Policy</a>
    </div>
  </div>

  <script>
  const { ipcRenderer } = require('electron');

  function openLink(type) {
    const { shell } = require('electron');
    const path = require('path');
    if (type === 'terms') {
      shell.openPath(path.join(__dirname, 'legal', 'terms-of-service.md'));
    } else {
      shell.openPath(path.join(__dirname, 'legal', 'privacy-policy.md'));
    }
  }

  const form = document.getElementById('signinForm');
  const submitBtn = document.getElementById('submitBtn');
  const errorMessage = document.getElementById('errorMessage');
  const successMessage = document.getElementById('successMessage');

  // Form submission
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const rememberMe = document.getElementById('rememberMe').checked;

    // Validation
    errorMessage.classList.remove('show');
    
    if (!email || !password) {
      showError('Please enter both email and password');
      return;
    }

    // Show loading state
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="loading"></span> Signing In...';

    // Send to main process to handle Supabase
    ipcRenderer.send('auth-signin', {
      email,
      password,
      rememberMe
    });
  });

  // Listen for auth response
  ipcRenderer.on('auth-signin-response', (event, response) => {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign In';

    if (response.success) {
      showSuccess('Welcome back! Loading your workspace...');
      setTimeout(() => {
        ipcRenderer.send('auth-complete');
      }, 1500);
    } else {
      showError(response.error || 'Invalid email or password');
    }
  });

  function showError(message) {
    errorMessage.textContent = message;
    errorMessage.classList.add('show');
    setTimeout(() => {
      errorMessage.classList.remove('show');
    }, 5000);
  }

  function showSuccess(message) {
    successMessage.textContent = message;
    successMessage.classList.add('show');
  }

  function goToSignUp() {
    ipcRenderer.send('go-to-signup');
  }

  function forgotPassword() {
    alert('Password reset feature coming soon!\n\nFor now, please contact support at support@studiobyscientist.com');
  }

  // Auto-fill email if remembered
  ipcRenderer.on('remembered-email', (event, email) => {
    if (email) {
      document.getElementById('email').value = email;
      document.getElementById('rememberMe').checked = true;
    }
  });

  console.log('✅ Sign In screen loaded');
  </script>
</body>
</html>
