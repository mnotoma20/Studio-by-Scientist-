<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>PDF Renderer</title></head>
<body>
<script type="module">
  const { ipcRenderer } = require('electron');
  const fs = require('fs');

  const params = new URLSearchParams(location.search);
  const libUrl = params.get('lib');
  const workerUrl = params.get('worker');

  let pdfjsLib = null;

  (async () => {
    try {
      pdfjsLib = await import(libUrl);
      pdfjsLib.GlobalWorkerOptions.workerSrc = workerUrl;
      ipcRenderer.send('pdf-renderer-ready', { ok: true });
    } catch (err) {
      ipcRenderer.send('pdf-renderer-ready', { ok: false, error: err.message });
    }
  })();

  // Render every page of a PDF to a PNG data URL at the given scale.
  ipcRenderer.on('render-pdf', async (_e, { pdfPath, scale }) => {
    try {
      const data = new Uint8Array(fs.readFileSync(pdfPath));
      const pdf = await pdfjsLib.getDocument({ data }).promise;
      const images = [];
      let aspect = 16 / 9;
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale });
        if (i === 1 && viewport.height > 0) aspect = viewport.width / viewport.height;
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport }).promise;
        images.push(canvas.toDataURL('image/png'));
        page.cleanup();
      }
      ipcRenderer.send('pdf-rendered', { success: true, images, aspect });
    } catch (err) {
      ipcRenderer.send('pdf-rendered', { success: false, error: err.message });
    }
  });
</script>
</body>
</html>
