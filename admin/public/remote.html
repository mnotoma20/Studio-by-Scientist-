<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Studio Remote</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; background: #0f0f1a; color: #fff; font-family: -apple-system, system-ui, sans-serif; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 15px; margin: 0; color: #a78bfa; letter-spacing: .5px; display: flex; justify-content: space-between; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
  .dot.ok { background: #22c55e; }
  .now { background: #1a1a2e; border: 1px solid rgba(167,139,250,.25); border-radius: 14px; padding: 14px; min-height: 96px; }
  .now small { color: #9ca3af; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .now .ref { font-weight: 800; font-size: 18px; margin: 4px 0; }
  .now .txt { color: #d1d5db; font-size: 14px; line-height: 1.4; max-height: 90px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { border: 0; border-radius: 16px; color: #fff; font-weight: 800; font-size: 18px; padding: 22px 8px; background: #2d2d4a; touch-action: manipulation; }
  button:active { transform: scale(.97); filter: brightness(1.25); }
  .big { background: linear-gradient(135deg, #ec4899, #a78bfa); font-size: 24px; padding: 36px 8px; }
  .verse { display: flex; gap: 8px; }
  .verse input { flex: 1; min-width: 0; padding: 16px; border-radius: 14px; border: 1px solid rgba(167,139,250,.3); background: #1a1a2e; color: #fff; font-size: 17px; outline: none; }
  .verse button { padding: 0 20px; font-size: 16px; background: #7c3aed; }
  html { background: #0f0f1a; }
  .live { background: #1a1a2e; border: 1px solid rgba(236,72,153,.3); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .live small { color: #9ca3af; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .listen { background: #2d2d4a; padding: 20px 8px; }
  .listen.on { background: #dc2626; }
  .follow { font-size: 14px; color: #f9a8d4; min-height: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 10px 14px; font-size: 14px; border-radius: 999px; background: #2d2d4a; font-weight: 600; }
  #boot { color: #9ca3af; font-size: 13px; text-align: center; }
  .msg { text-align: center; font-size: 13px; color: #9ca3af; min-height: 18px; }
  .msg.err { color: #fca5a5; }
</style>
</head>
<body>
  <h1><span>STUDIO REMOTE</span><span class="dot" id="dot"></span></h1>
  <div class="now">
    <small>On screen now</small>
    <div class="ref" id="ref">Nothing</div>
    <div class="txt" id="txt"></div>
  </div>
  <div class="row">
    <button onclick="send('prev')">◀ Previous</button>
    <button class="big" onclick="send('next')" style="grid-row: span 1">Next ▶</button>
  </div>
  <div class="row">
    <button onclick="send('blank')">⬛ Blank</button>
    <button onclick="send('logo')">🖼 Logo</button>
  </div>
  <div class="live" id="videoBox" style="display:none">
    <small>Video on screen</small>
    <div class="follow" id="videoName"></div>
    <div class="row">
      <button id="videoToggle" onclick="send('video-toggle')">⏯ Play / Pause</button>
      <button onclick="send('video-restart')">↺ Restart</button>
    </div>
  </div>
  <form class="verse" onsubmit="event.preventDefault(); sendVerse();">
    <input id="ref-in" placeholder="John 3:16" autocapitalize="words" autocomplete="off" enterkeyhint="go">
    <button type="submit">Show</button>
  </form>
  <div class="live">
    <small>Live Mode (AI listening)</small>
    <button class="listen" id="listenBtn" onclick="toggleListen()">🎙 Start listening</button>
    <button class="listen" id="phoneBtn" onclick="togglePhoneMic()">📱 Listen with this phone</button>
    <div class="follow" id="phoneNote"></div>
    <div class="follow" id="follow"></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="msg" id="msg"></div>
  <div id="boot">Connecting to Studio...</div>
<script>
  const S = new URLSearchParams(location.search).get('s');
  const $ = (id) => document.getElementById(id);
  let msgTimer;
  function say(text, err) {
    $('msg').textContent = text; $('msg').className = 'msg' + (err ? ' err' : '');
    clearTimeout(msgTimer); msgTimer = setTimeout(() => { $('msg').textContent = ''; }, 3000);
  }
  async function post(body) {
    const r = await fetch('/api/remote/cmd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ s: S, ...body }) });
    return r.json();
  }
  async function send(cmd) {
    if (navigator.vibrate) navigator.vibrate(15);
    try {
      const r = await post({ cmd });
      if (!r.success) say(r.error || 'Could not do that', true);
      poll();
    } catch (e) { say('Lost connection to Studio', true); }
  }
  async function sendVerse() {
    const ref = $('ref-in').value.trim();
    if (!ref) return;
    try {
      const r = await post({ cmd: 'verse', ref });
      if (r.success) { $('ref-in').value = ''; $('ref-in').blur(); say('Sent'); }
      else say(r.error || 'Could not find that verse', true);
      poll();
    } catch (e) { say('Lost connection to Studio', true); }
  }
  let listening = false;
  function toggleListen() { send(listening ? 'listen-stop' : 'listen-start'); }

  // ── Listening with this phone's microphone ──
  // Same service the computer uses: audio goes from here straight to OpenAI's live transcription
  // (using a short-lived pass from our server) and the words are relayed to Studio, which runs its
  // normal verse detection on them.
  let pm = null;   // { ctx, stream, node, ws, wake, active, buf, timer, chain, startedAt, misses }
  const pmNote = (t, err) => { $('phoneNote').textContent = t; $('phoneNote').style.color = err ? '#fca5a5' : ''; };

  function pmResample(input, from) {
    if (from === 24000) return input;
    const ratio = from / 24000, n = Math.floor(input.length / ratio), out = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = i * ratio, i0 = Math.floor(x), i1 = Math.min(i0 + 1, input.length - 1), f = x - i0;
      out[i] = input[i0] * (1 - f) + input[i1] * f;
    }
    return out;
  }
  function pmB64(int16) {
    const b = new Uint8Array(int16.buffer); let s = '';
    for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    return btoa(s);
  }
  // One request at a time (keeps the words in order); anything heard meanwhile goes out in the next one.
  function pmSendText() {
    if (!pm || !pm.buf || pm.sending) return;
    const text = pm.buf; pm.buf = ''; pm.sending = true;
    fetch('/api/remote/text', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ s: S, text }) })
      .catch(() => {}).finally(() => { if (pm) { pm.sending = false; pmSendText(); } });
  }
  async function pmConnect() {
    const r = await fetch('/api/remote/live-token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ s: S }) });
    const t = await r.json().catch(() => ({}));
    if (!r.ok || !t.value) throw new Error(t.error || 'Could not start listening');
    await new Promise((resolve, reject) => {
      const ws = new WebSocket('wss://api.openai.com/v1/realtime?intent=transcription', ['realtime', 'openai-insecure-api-key.' + t.value]);
      let opened = false;
      ws.onopen = () => { opened = true; pm.ws = ws; resolve(); };
      ws.onmessage = (ev) => {
        let e; try { e = JSON.parse(ev.data); } catch (_) { return; }
        if (e.type === 'conversation.item.input_audio_transcription.delta' && e.delta) { pm.buf += e.delta; pmSendText(); }
        else if (e.type === 'error') pmNote((e.error && e.error.message) || 'Transcription error', true);
      };
      ws.onerror = () => { if (!opened) reject(new Error('Could not reach the listening service')); };
      ws.onclose = () => { if (pm && pm.ws === ws) { pm.ws = null; if (pm.active) pmReconnect(); } };
    });
  }
  async function pmReconnect() {
    if (!pm || pm.reconnecting) return;
    pm.reconnecting = true; pmNote('Reconnecting…');
    for (let i = 1; pm && pm.active && !pm.ws && i <= 8; i++) {
      await new Promise((r) => setTimeout(r, Math.min(500 * i, 4000)));
      try { await pmConnect(); pmNote('Listening with this phone'); } catch (_) { /* try again */ }
    }
    if (pm) { pm.reconnecting = false; if (pm.active && !pm.ws) { pmNote('Lost connection — tap to try again', true); stopPhoneMic(true); } }
  }
  async function startPhoneMic() {
    if (pm) return;
    $('phoneBtn').disabled = true; pmNote('Starting…');
    try {
      pm = { active: true, buf: '', chain: Promise.resolve(), startedAt: Date.now(), misses: 0, ws: null };
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      pm.stream = stream;
      const r = await post({ cmd: 'phone-listen-start' });
      if (!r.success) throw new Error(r.error || 'Studio did not start listening');
      await pmConnect();
      const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      if (ctx.state === 'suspended') await ctx.resume();
      pm.ctx = ctx;
      const src = ctx.createMediaStreamSource(stream);
      const mute = ctx.createGain(); mute.gain.value = 0; mute.connect(ctx.destination);
      let pending = [], pendingLen = 0;
      const onAudio = (f32) => {
        if (!pm || !pm.ws || pm.ws.readyState !== 1) return;
        const a = pmResample(f32, ctx.sampleRate);
        pending.push(a); pendingLen += a.length;
        if (pendingLen < 2400) return;   // ~100 ms
        const block = new Float32Array(pendingLen); let o = 0;
        for (const p of pending) { block.set(p, o); o += p.length; }
        pending = []; pendingLen = 0;
        const pcm = new Int16Array(block.length);
        for (let i = 0; i < block.length; i++) { const v = Math.max(-1, Math.min(1, block[i])); pcm[i] = v < 0 ? v * 0x8000 : v * 0x7FFF; }
        pm.ws.send(JSON.stringify({ type: 'input_audio_buffer.append', audio: pmB64(pcm) }));
      };
      try {
        const code = "class P extends AudioWorkletProcessor{process(i){const a=i[0];if(a&&a[0])this.port.postMessage(a[0].slice(0));return true;}}registerProcessor('pcm-capture',P);";
        const url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
        await ctx.audioWorklet.addModule(url); URL.revokeObjectURL(url);
        pm.node = new AudioWorkletNode(ctx, 'pcm-capture');
        pm.node.port.onmessage = (ev) => onAudio(ev.data);
      } catch (_) {
        pm.node = ctx.createScriptProcessor(2048, 1, 1);
        pm.node.onaudioprocess = (ev) => onAudio(new Float32Array(ev.inputBuffer.getChannelData(0)));
      }
      src.connect(pm.node); pm.node.connect(mute);
      pm.timer = setInterval(pmSendText, 300);
      try { if (navigator.wakeLock) pm.wake = await navigator.wakeLock.request('screen'); } catch (_) { /* optional */ }
      $('phoneBtn').className = 'listen on'; $('phoneBtn').textContent = '⏹ Stop listening with phone';
      pmNote('Listening with this phone — keep this page open and the screen on');
    } catch (e) {
      const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      pmNote(denied ? 'Microphone is blocked. Allow it for this page in your browser settings.' : (e.message || 'Could not start'), true);
      await stopPhoneMic(false);
    }
    $('phoneBtn').disabled = false;
  }
  async function stopPhoneMic(tellStudio) {
    const m = pm; pm = null;
    if (!m) return;
    m.active = false;
    clearInterval(m.timer);
    try { if (m.node) m.node.disconnect(); } catch (_) {}
    try { if (m.ctx) m.ctx.close(); } catch (_) {}
    try { if (m.stream) m.stream.getTracks().forEach((t) => t.stop()); } catch (_) {}
    try { if (m.ws) m.ws.close(); } catch (_) {}
    try { if (m.wake) m.wake.release(); } catch (_) {}
    if (m.buf) { try { await fetch('/api/remote/text', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ s: S, text: m.buf }) }); } catch (_) {} }
    if (tellStudio !== false) { try { await post({ cmd: 'phone-listen-stop' }); } catch (_) {} }
    $('phoneBtn').className = 'listen'; $('phoneBtn').textContent = '📱 Listen with this phone';
    if (tellStudio !== false) pmNote('');
  }
  function togglePhoneMic() { if (pm && pm.active) { stopPhoneMic(true); } else startPhoneMic(); }
  // If Studio stopped listening (someone pressed the mic on the computer), stop capturing here too
  function pmCheck(l) {
    if (!pm || !pm.active || Date.now() - pm.startedAt < 8000) return;
    if (l.phone) { pm.misses = 0; return; }
    if (++pm.misses >= 2) { pmNote('Studio stopped listening'); stopPhoneMic(false); }
  }
  window.addEventListener('pagehide', () => { if (pm) stopPhoneMic(true); });
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && pm && pm.active && navigator.wakeLock) { try { pm.wake = await navigator.wakeLock.request('screen'); } catch (_) {} }
  });
  window.onerror = (m) => { $('boot').style.display = 'block'; $('boot').textContent = 'Page error: ' + m; };
  async function poll() {
    try {
      const res = await fetch('/api/remote/state?s=' + S);
      const s = await res.json();
      if (!res.ok) { $('dot').className = 'dot'; $('boot').style.display = 'block'; $('boot').textContent = s.error || 'Cannot reach Studio'; return; }
      $('dot').className = s.online ? 'dot ok' : 'dot';
      $('boot').style.display = s.online ? 'none' : 'block';
      if (!s.online) $('boot').textContent = 'Studio is not connected. Is it open and online?';
      $('ref').textContent = s.ref || 'Nothing';
      $('txt').textContent = s.text || '';
      $('videoBox').style.display = s.video ? 'flex' : 'none';
      if (s.video) {
        const t = (n) => Math.floor(n / 60) + ':' + String(Math.floor(n % 60)).padStart(2, '0');
        $('videoName').textContent = s.video.name + ' · ' + (s.video.playing ? 'playing' : 'paused') + (s.video.duration ? ' · ' + t(s.video.time) + ' / ' + t(s.video.duration) : '');
      }
      const l = s.live || {};
      listening = !!l.listening;
      pmCheck(l);
      $('listenBtn').className = 'listen' + (listening ? ' on' : '');
      $('listenBtn').textContent = listening ? '⏹ Stop listening' : '🎙 Start listening';
      $('follow').textContent = listening && l.following ? 'Following: ' + l.following : '';
      $('chips').innerHTML = '';
      (l.recent || []).forEach((r) => {
        const b = document.createElement('button');
        b.className = 'chip'; b.textContent = r;
        b.onclick = () => { $('ref-in').value = r; sendVerse(); };
        $('chips').appendChild(b);
      });
    } catch (e) { $('dot').className = 'dot'; $('boot').style.display = 'block'; $('boot').textContent = 'No internet on this phone? Check your connection.'; }
  }
  poll(); setInterval(poll, 2000);
</script>
</body>
</html>
