<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Studio Remote</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; background: #0f0f1a; color: #fff; font-family: -apple-system, system-ui, sans-serif; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 15px; margin: 0; color: #a78bfa; letter-spacing: .5px; display: flex; justify-content: space-between; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
  .dot.ok { background: #22c55e; }
  .now { background: #1a1a2e; border: 1px solid rgba(167,139,250,.25); border-radius: 14px; padding: 14px; min-height: 96px; }
  .now small { color: #9ca3af; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .now .ref { font-weight: 800; font-size: 18px; margin: 4px 0; }
  .now .txt { color: #d1d5db; font-size: 14px; line-height: 1.4; max-height: 90px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { border: 0; border-radius: 16px; color: #fff; font-weight: 800; font-size: 18px; padding: 22px 8px; background: #2d2d4a; touch-action: manipulation; }
  button:active { transform: scale(.97); filter: brightness(1.25); }
  .big { background: linear-gradient(135deg, #ec4899, #a78bfa); font-size: 24px; padding: 36px 8px; }
  .verse { display: flex; gap: 8px; }
  .verse input { flex: 1; min-width: 0; padding: 16px; border-radius: 14px; border: 1px solid rgba(167,139,250,.3); background: #1a1a2e; color: #fff; font-size: 17px; outline: none; }
  .verse button { padding: 0 20px; font-size: 16px; background: #7c3aed; }
  html { background: #0f0f1a; }
  .live { background: #1a1a2e; border: 1px solid rgba(236,72,153,.3); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .live small { color: #9ca3af; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .listen { background: #2d2d4a; padding: 20px 8px; }
  .listen.on { background: #dc2626; }
  .follow { font-size: 14px; color: #f9a8d4; min-height: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 10px 14px; font-size: 14px; border-radius: 999px; background: #2d2d4a; font-weight: 600; }
  #boot { color: #9ca3af; font-size: 13px; text-align: center; }
  .msg { text-align: center; font-size: 13px; color: #9ca3af; min-height: 18px; }
  .msg.err { color: #fca5a5; }
</style>
</head>
<body>
  <h1><span>STUDIO REMOTE</span><span class="dot" id="dot"></span></h1>
  <div class="now">
    <small>On screen now</small>
    <div class="ref" id="ref">Nothing</div>
    <div class="txt" id="txt"></div>
  </div>
  <div class="row">
    <button onclick="send('prev')">◀ Previous</button>
    <button class="big" onclick="send('next')" style="grid-row: span 1">Next ▶</button>
  </div>
  <div class="row">
    <button onclick="send('blank')">⬛ Blank</button>
    <button onclick="send('logo')">🖼 Logo</button>
  </div>
  <form class="verse" onsubmit="event.preventDefault(); sendVerse();">
    <input id="ref-in" placeholder="John 3:16" autocapitalize="words" autocomplete="off" enterkeyhint="go">
    <button type="submit">Show</button>
  </form>
  <div class="live">
    <small>Live Mode (AI listening)</small>
    <button class="listen" id="listenBtn" onclick="toggleListen()">🎙 Start listening</button>
    <div class="follow" id="follow"></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="msg" id="msg"></div>
  <div id="boot">Connecting to Studio...</div>
<script>
  const S = new URLSearchParams(location.search).get('s');
  const $ = (id) => document.getElementById(id);
  let msgTimer;
  function say(text, err) {
    $('msg').textContent = text; $('msg').className = 'msg' + (err ? ' err' : '');
    clearTimeout(msgTimer); msgTimer = setTimeout(() => { $('msg').textContent = ''; }, 3000);
  }
  async function post(body) {
    const r = await fetch('/api/remote/cmd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ s: S, ...body }) });
    return r.json();
  }
  async function send(cmd) {
    if (navigator.vibrate) navigator.vibrate(15);
    try {
      const r = await post({ cmd });
      if (!r.success) say(r.error || 'Could not do that', true);
      poll();
    } catch (e) { say('Lost connection to Studio', true); }
  }
  async function sendVerse() {
    const ref = $('ref-in').value.trim();
    if (!ref) return;
    try {
      const r = await post({ cmd: 'verse', ref });
      if (r.success) { $('ref-in').value = ''; $('ref-in').blur(); say('Sent'); }
      else say(r.error || 'Could not find that verse', true);
      poll();
    } catch (e) { say('Lost connection to Studio', true); }
  }
  let listening = false;
  function toggleListen() { send(listening ? 'listen-stop' : 'listen-start'); }
  window.onerror = (m) => { $('boot').style.display = 'block'; $('boot').textContent = 'Page error: ' + m; };
  async function poll() {
    try {
      const res = await fetch('/api/remote/state?s=' + S);
      const s = await res.json();
      if (!res.ok) { $('dot').className = 'dot'; $('boot').style.display = 'block'; $('boot').textContent = s.error || 'Cannot reach Studio'; return; }
      $('dot').className = s.online ? 'dot ok' : 'dot';
      $('boot').style.display = s.online ? 'none' : 'block';
      if (!s.online) $('boot').textContent = 'Studio is not connected. Is it open and online?';
      $('ref').textContent = s.ref || 'Nothing';
      $('txt').textContent = s.text || '';
      const l = s.live || {};
      listening = !!l.listening;
      $('listenBtn').className = 'listen' + (listening ? ' on' : '');
      $('listenBtn').textContent = listening ? '⏹ Stop listening' : '🎙 Start listening';
      $('follow').textContent = listening && l.following ? 'Following: ' + l.following : '';
      $('chips').innerHTML = '';
      (l.recent || []).forEach((r) => {
        const b = document.createElement('button');
        b.className = 'chip'; b.textContent = r;
        b.onclick = () => { $('ref-in').value = r; sendVerse(); };
        $('chips').appendChild(b);
      });
    } catch (e) { $('dot').className = 'dot'; $('boot').style.display = 'block'; $('boot').textContent = 'No internet on this phone? Check your connection.'; }
  }
  poll(); setInterval(poll, 2000);
</script>
</body>
</html>
